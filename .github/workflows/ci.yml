name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 + 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24 并启用 npm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试与集成测试
        run: npm test

  e2e:
    name: 端到端测试（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24 并启用 npm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium 及系统依赖
        run: npx playwright install --with-deps chromium

      - name: 运行端到端测试
        run: npm run test:e2e

      - name: 上传 Playwright 报告便于失败定位
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: 镜像构建与容器运行验证
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Docker 环境信息
        run: docker version && docker info --format '架构={{.Architecture}} 存储驱动={{.Driver}}'

      - name: 构建镜像
        run: docker build -t aiqa . 2>&1 | tee build.log

      - name: 查看镜像体积
        run: docker images aiqa --format '镜像={{.Repository}}:{{.Tag}} 体积={{.Size}}'

      - name: 后台启动容器并映射端口
        run: |
          docker run -d -p 3000:3000 --name qa-helper --restart=unless-stopped aiqa
          sleep 3
          docker ps --filter name=qa-helper

      - name: 验证容器内应用可访问
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            echo "第 $i 次探测首页 HTTP 状态: $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          echo "--- 首页标题 ---"
          curl -s http://localhost:3000/ | grep -o '<title>.*</title>' || true

      - name: 容器内提问接口验证
        run: |
          echo "--- POST /api/ask ---"
          curl -s -X POST http://localhost:3000/api/ask \
            -H 'Content-Type: application/json' \
            -d '{"question":"CI 里容器能正常回答吗？"}' | tee ask.json
          echo ""
          echo "--- 校验回答非空 ---"
          node -e "const d=require('./ask.json'); if(!d.answer){console.error('answer 为空');process.exit(1)} console.log('回答长度:', d.answer.length, '来源数:', (d.sources||[]).length)"

      - name: 查看容器日志
        run: docker logs qa-helper

      - name: 清理容器
        if: always()
        run: docker rm -f qa-helper || true

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: build.log
          retention-days: 7
